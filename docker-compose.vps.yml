name: veritrade_vps_backend

services:
  db:
    image: mysql:8.0
    container_name: veritrade_db_vps
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veritrade}
      MYSQL_USER: ${MYSQL_USER:-veritrade}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - veritrade_mysql_vps:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - veritrade_vps_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritrade-api:vps
    container_name: veritrade_api_vps
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ${JWT_KEYS_DIR:-/root/horbis-jwt-keys}:/run/secrets:ro
      - veritrade_uploads_vps:/app/uploads
      - veritrade_salida_vps:/app/salida
    networks:
      - veritrade_vps_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loader:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: veritrade-api:vps
    container_name: veritrade_loader_vps
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - veritrade_uploads_vps:/app/uploads
      - veritrade_salida_vps:/app/salida
    networks:
      - veritrade_vps_net
    entrypoint: ["python"]
    command: ["--help"]

volumes:
  veritrade_mysql_vps:
    name: veritrade_mysql_vps
  veritrade_uploads_vps:
    name: veritrade_uploads_vps
  veritrade_salida_vps:
    name: veritrade_salida_vps

networks:
  veritrade_vps_net:
    external: true
    name: ${VERITRADE_NETWORK:-veritrade_vps_net}
