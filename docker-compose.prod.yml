name: veritrade_backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritrade-api:latest
    container_name: veritrade_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - veritrade_uploads:/app/uploads
      - veritrade_salida:/app/salida
    networks:
      - veritrade_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  veritrade_uploads:
    name: veritrade_uploads
  veritrade_salida:
    name: veritrade_salida

networks:
  veritrade_net:
    name: veritrade_net
